<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Products Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="section-header">
            <div class="title-wrapper">
                <h2 class="section-title">WOMEN'S PRODUCTS</h2>
            </div>
            <nav class="section-nav">
                <ul>
                    <li><a href="#">All</a></li>
                    <li><a href="#">Clothings</a></li>
                    <li><a href="#">Bags</a></li>
                    <li><a href="#">Shoes</a></li>
                    <li><a href="#">Watches</a></li>
                    <li><a href="#">Goggles</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">

            <!-- Grid product -->
            <section class="left-column product-grid">
                <!-- Thẻ sản phẩm 1 -->
                <article class="product-card">
                    <div class="product-image">
                        <img src="public/product1.png" alt="Wonen Bags" class="product-img">
                    </div>
                    <div class="product-info">
                        <h3 style="color:red; text-align: center;">Women Bags</h3>
                        <div class="product-price">
                            <span class="new-price">€50.00</span>
                        </div>
                        <div class="btn-wrapper">
                            <button class="btn-add-cart">ADD TO CART</button>
                        </div>
                    </div>
                </article>

                <!-- Thẻ sản phẩm 2 -->
                <article class="product-card">
                    <div class="product-image">
                        <img src="public/product2.png" alt="Goggles" class="product-img">
                    </div>
                    <div class="product-info">
                        <h3 style="color:red; text-align: center;">Goggles</h3>
                        <div class="product-price">
                            <span class="current-price">€25.00</span>
                            <br><br>
                        </div>
                        <div class="btn-wrapper">
                            <button class="btn-add-cart">ADD TO CART</button>
                        </div>
                    </div>
                </article>
            </section>

            <!-- Banner -->
            <section class="right-column promo-banner placeholder-bg">
                <div class="banner-content">
                    <h2 class="banner-title">FOR WOMEN</h2>
                    <button class="btn-view-all">VIEW ALL</button>
                </div>
            </section>

        </main>
    </div>
</body>

</html>
