<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm từ API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
    </style>
</head>

<body class="container">
    <h1 class="text-center mb-4">Danh sách sản phẩm từ API</h1>
    <div class="product-grid" id="product-container"></div>
    <script>
        async function fetchProducts() {
            try {
                // Đổi thành /api/products khớp với app.js
                const response = await fetch('/api/products');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const products = await response.json();

                const container = document.getElementById('product-container');
                container.innerHTML = '';

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'card shadow-sm p-3';

                    // Lấy tên danh mục từ trường categoryId đã populate
                    const categoryName = (product.categoryId && product.categoryId.name)
                        ? product.categoryId.name
                        : 'Chưa phân loại';

                    card.innerHTML = `
                        <h5 class="card-title text-primary">${product.name}</h5>
                        <p class="mb-1 text-danger fw-bold">Giá: ${Number(product.price).toLocaleString()} đ</p>
                        <p class="mb-1 text-muted">Loại: <strong>${categoryName}</strong></p>
                        <p class="mb-0 text-success">Tồn kho: ${product.stock}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Lỗi khi lấy dữ liệu sản phẩm:', error);
            }
        }
        fetchProducts();
    </script>
</body>

</html>
